name: Process Receipt (experimental)
description: Run a trusted argument vector and export actual execution separately from receipt failure.
inputs:
  command-json:
    description: Trusted executable and argument array as JSON. Never use raw PR text as a command.
    required: true
  receipt-path:
    description: Optional new receipt filename. Parent must exist; existing files are never reused.
    required: false
    default: ''
  stop-file:
    description: Optional stop-file path; an existing path prevents launch.
    required: false
    default: ''
  timeout:
    description: Child observation deadline in seconds.
    default: '60'
  grace:
    description: Termination wait in seconds; Windows termination is forcible, not graceful.
    default: '1'
outputs:
  action-status:
    description: completed, failed, rejected, receipt_persistence_failed or adapter_error.
    value: ${{ steps.run.outputs.action-status }}
  execution-status:
    description: Observed execution status, independently of receipt transport.
    value: ${{ steps.run.outputs.execution-status }}
  task-started:
    description: 'true, false, or unknown. Missing is not false.'
    value: ${{ steps.run.outputs.task-started }}
  exit-observed:
    description: 'true, false, or unknown.'
    value: ${{ steps.run.outputs.exit-observed }}
  child-exit-code:
    description: Actual direct-child return code or unknown, not the action step exit.
    value: ${{ steps.run.outputs.child-exit-code }}
  receipt-state:
    description: finalized, unconfirmed, or not_created for this invocation.
    value: ${{ steps.run.outputs.receipt-state }}
  receipt-path:
    description: Requested receipt path. Existence alone does not establish this invocation's result.
    value: ${{ steps.run.outputs.receipt-path }}
  summary-path:
    description: Local adapter summary path, subject to output-I/O limitations.
    value: ${{ steps.run.outputs.summary-path }}
runs:
  using: composite
  steps:
    - id: run
      shell: python
      env:
        PR_ACTION_PATH: ${{ github.action_path }}
        PR_COMMAND_JSON: ${{ inputs.command-json }}
        PR_RECEIPT_PATH: ${{ inputs.receipt-path }}
        PR_STOP_FILE: ${{ inputs.stop-file }}
        PR_TIMEOUT: ${{ inputs.timeout }}
        PR_GRACE: ${{ inputs.grace }}
      run: |
        import os, runpy
        runpy.run_path(os.path.join(os.environ['PR_ACTION_PATH'], 'run_action.py'), run_name='__main__')
