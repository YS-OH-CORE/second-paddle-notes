name: PyTorch intermediate forward-tangent review

on:
  push:
    branches: [verify/pytorch-192656-forwardad-20260928]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  forward-ad:
    if: github.repository == 'YS-OH-CORE/second-paddle-notes' && github.ref == 'refs/heads/verify/pytorch-192656-forwardad-20260928'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: evidence
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: pytorch/pytorch
          ref: 061ace3a865340a4f6a351e5ef8f3a7f37b6645e
          path: pytorch-parent
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /torch/_subclasses/functional_tensor.py
            /torch/autograd/forward_ad.py
            /LICENSE
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: pytorch/pytorch
          ref: eb9c90dd1f2b67cadf9f7681176f1b5fab074423
          path: pytorch-candidate
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /torch/_subclasses/functional_tensor.py
            /torch/autograd/forward_ad.py
            /LICENSE
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: '0.9.28'
          enable-cache: false
      - name: Prepare one disposable CPU wheel environment
        working-directory: evidence
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pytorch-forwardad-receipt"
          uv venv --python 3.12
          uv pip install --python .venv/bin/python torch==2.13.0 --torch-backend cpu expecttest hypothesis numpy unittest-xml-reporting==3.2.0 2>&1 | tee "$RUNNER_TEMP/pytorch-forwardad-receipt/install.log"
          uv pip freeze --python .venv/bin/python > "$RUNNER_TEMP/pytorch-forwardad-receipt/packages.txt"
      - name: Compare exact source variants and restore the original wheel sources
        working-directory: evidence
        run: |
          .venv/bin/python checks/pytorch-192656-forwardad/run.py \
            --parent ../pytorch-parent \
            --candidate ../pytorch-candidate \
            --receipt "$RUNNER_TEMP/pytorch-forwardad-receipt"
      - name: Preserve raw receipts for successful, failing, and setup-failure runs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pytorch-192656-forwardad-review
          path: ${{ runner.temp }}/pytorch-forwardad-receipt
          if-no-files-found: warn
          retention-days: 30
