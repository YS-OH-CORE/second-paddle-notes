name: SGLang 41404 unchanged CPU suite verification

on:
  push:
    branches: [verify/sglang-41404-baseline-20260929]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  environment:
    if: github.repository == 'YS-OH-CORE/second-paddle-notes' && github.ref == 'refs/heads/verify/sglang-41404-baseline-20260929'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SGLANG_IS_IN_CI: 'true'
      SGLANG_TEST_MAX_RETRY: '0'
      SGLANG_BUILD_RUST_EXTS: none
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: evidence
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: sgl-project/sglang
          ref: d574752ef39eb3ef73f87c40dca95d76222f9483
          path: sglang
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: '0.9.28'
          enable-cache: false
      - name: Install the official alternate-platform runtime with CPU Torch
        working-directory: sglang
        run: |
          set -euo pipefail
          receipt_dir="$RUNNER_TEMP/sglang-41404-environment"
          mkdir -p "$receipt_dir"
          uv venv --python 3.12
          cp python/pyproject.toml "$receipt_dir/original-pyproject.toml"
          trap 'cp "$receipt_dir/original-pyproject.toml" python/pyproject.toml' EXIT
          cp python/pyproject_other.toml python/pyproject.toml
          uv pip install --python .venv/bin/python --torch-backend cpu \
            --editable 'python[srt_empty,runtime_common]' \
            torch==2.13.0 torchvision==0.28.0 triton==3.8.0 \
            2>&1 | tee "$receipt_dir/install.log"
          cp "$receipt_dir/original-pyproject.toml" python/pyproject.toml
          cmp "$receipt_dir/original-pyproject.toml" python/pyproject.toml
          trap - EXIT
          uv pip freeze --python .venv/bin/python > "$receipt_dir/packages.txt"
          git status --short > "$receipt_dir/source-status.txt"
          git diff --exit-code -- python/pyproject.toml
      - name: Import the unchanged test and verify core source provenance
        working-directory: sglang
        run: |
          set -euo pipefail
          receipt_dir="$RUNNER_TEMP/sglang-41404-environment"
          .venv/bin/python ../evidence/checks/sglang-41404-deferred-release/env_probe.py \
            --source . --output "$receipt_dir/import.json" \
            > "$receipt_dir/import.stdout" 2> "$receipt_dir/import.stderr"
      - name: Run the upstream registered CPU test file
        working-directory: sglang
        run: |
          set -euo pipefail
          receipt_dir="$RUNNER_TEMP/sglang-41404-environment"
          set +e
          .venv/bin/python test/registered/unit/disaggregation/test_deferred_decode_kv_release.py -v \
            > "$receipt_dir/upstream.stdout" 2> "$receipt_dir/upstream.stderr"
          test_rc=$?
          set -e
          printf '%s\n' "$test_rc" > "$receipt_dir/upstream.exit-code.txt"
          cat "$receipt_dir/upstream.stderr"
          exit "$test_rc"
      - name: Retain setup and import failures as environment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sglang-41404-environment
          path: ${{ runner.temp }}/sglang-41404-environment
          if-no-files-found: warn
          retention-days: 30
