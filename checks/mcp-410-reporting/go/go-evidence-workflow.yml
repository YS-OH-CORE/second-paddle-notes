name: PR 410 real Go SDK evidence

on:
  push:
    branches:
      - ci/pr-410-go-20260928
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          path: verification
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: YS-OH-CORE/conformance
          ref: eac19c4499ebb37ea359024be9aa4cd5c401c154
          fetch-depth: 4
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: modelcontextprotocol/go-sdk
          ref: 827f90ba0c13edb546028df42fadc9f1211a4ff2
          path: go-sdk
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache: false
      - name: Install shared conformance dependencies
        working-directory: candidate
        run: npm ci
      - name: Prepare unchanged baseline
        working-directory: candidate
        run: |
          git worktree add --detach "$GITHUB_WORKSPACE/baseline" 7169291ec0b68eb370fddcd9947313ab0d5e4156
          ln -s "$GITHUB_WORKSPACE/candidate/node_modules" "$GITHUB_WORKSPACE/baseline/node_modules"
      - name: Run existing CLI against pinned Go SDK
        run: |
          node "$GITHUB_WORKSPACE/verification/.github/evidence/pr-410/run-go-evidence.mjs" \
            --candidate "$GITHUB_WORKSPACE/candidate" \
            --baseline "$GITHUB_WORKSPACE/baseline" \
            --sdk "$GITHUB_WORKSPACE/go-sdk" \
            --output "$GITHUB_WORKSPACE/go-evidence-results" \
            --suite-modes stateful,stateless
      - name: Retain complete evidence including failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mcp410-real-go-evidence
          path: |
            go-evidence-results/**
            !go-evidence-results/build-work/**
          if-no-files-found: warn
          retention-days: 30
