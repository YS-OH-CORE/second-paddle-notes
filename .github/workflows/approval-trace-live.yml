name: Verify public approval trace entry
on:
  pull_request:
    paths:
      - 'tools/approval-trace-check/verify_live.py'
      - '.github/workflows/approval-trace-live.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live_entry:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare isolated public browser test
        run: |
          python3 -m venv "$RUNNER_TEMP/live-venv"
          "$RUNNER_TEMP/live-venv/bin/python" -m pip install --disable-pip-version-check playwright==1.57.0
          "$RUNNER_TEMP/live-venv/bin/python" -m playwright install --with-deps chromium webkit
      - name: Navigate the real public entry and use synthetic traces
        run: |
          "$RUNNER_TEMP/live-venv/bin/python" tools/approval-trace-check/verify_live.py --out "$RUNNER_TEMP/live-entry-evidence"
      - name: Retain actual response and browser observations
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: approval-trace-live-entry
          path: ${{ runner.temp }}/live-entry-evidence/
          if-no-files-found: warn
          retention-days: 14
