name: Recover a lost GitHub Contents API response from provider state
'on':
  pull_request:
    paths:
      - 'contributions/github-response-loss/probe.py'
      - 'contributions/github-response-loss/test_probe.py'
      - 'contributions/github-response-loss/README.md'
      - '.github/workflows/github-response-loss.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provider-response-loss:
    if: github.repository == 'YS-OH-CORE/second-paddle-notes' && (github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'zero/github-response-loss-20260914'))
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: write
    env:
      TARGET_BRANCH: zero/github-response-loss-provider-20260914
      LOSS_EVIDENCE_DIR: ${{ runner.temp }}/github-response-loss-evidence
      GH_RESPONSE_LOSS_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Compile and run offline data checks
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile contributions/github-response-loss/*.py
          (cd contributions/github-response-loss && python -S -m unittest -v test_probe) 2>&1 | tee "$RUNNER_TEMP/github-response-loss-unit.log"
      - name: Lose the real provider response and reconcile authoritative state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$LOSS_EVIDENCE_DIR"
          timeout 90s python contributions/github-response-loss/probe.py 2>&1 | tee "$RUNNER_TEMP/github-response-loss-probe.log"
      - name: Retain synthetic observations only
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: github-response-loss
          path: |
            ${{ runner.temp }}/github-response-loss-evidence/*.json
            ${{ runner.temp }}/github-response-loss-unit.log
            ${{ runner.temp }}/github-response-loss-probe.log
          if-no-files-found: error
          retention-days: 14
