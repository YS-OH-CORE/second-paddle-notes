name: Check structured result handoff to an AG-UI host
on:
  pull_request:
    paths:
      - 'contributions/agui-structured-handoff/**'
      - '.github/workflows/agui-structured-handoff.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install published SDKs in disposable environments
        run: |
          python3 -m venv "$RUNNER_TEMP/agui-python"
          "$RUNNER_TEMP/agui-python/bin/python" -m pip install --disable-pip-version-check ag-ui-protocol==0.1.22 mcp==2.2.0
          npm install --prefix "$RUNNER_TEMP/agui-node" --ignore-scripts --no-audit --no-fund @ag-ui/client@0.0.59 @ag-ui/core@0.0.59
          "$RUNNER_TEMP/agui-python/bin/python" -m pip freeze > "$RUNNER_TEMP/agui-dependencies.txt"
          npm ls --prefix "$RUNNER_TEMP/agui-node" --all --json > "$RUNNER_TEMP/agui-npm-dependencies.json"
      - name: Exercise selected-copy boundaries
        working-directory: contributions/agui-structured-handoff
        run: |
          set -o pipefail
          "$RUNNER_TEMP/agui-python/bin/python" -m unittest -v test_bridge 2>&1 | tee "$RUNNER_TEMP/agui-unit.txt"
      - name: Follow actual Python SSE into the published TypeScript client
        env:
          NODE_PATH: ${{ runner.temp }}/agui-node/node_modules
        run: |
          set -o pipefail
          "$RUNNER_TEMP/agui-python/bin/python" contributions/agui-structured-handoff/probe.py --out "$RUNNER_TEMP/agui-evidence" 2>&1 | tee "$RUNNER_TEMP/agui-run.txt"
      - name: Keep only synthetic observations and dependency records
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agui-structured-handoff
          path: |
            ${{ runner.temp }}/agui-evidence/
            ${{ runner.temp }}/agui-*.txt
            ${{ runner.temp }}/agui-npm-dependencies.json
          if-no-files-found: warn
          retention-days: 14
