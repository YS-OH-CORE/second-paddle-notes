name: Tokenizers 2466 isolated normalization versions
on:
  push:
    branches: ['verify/tokenizers-2466-normalizer-control-20260929']
permissions:
  contents: read
jobs:
  versions:
    if: github.repository == 'YS-OH-CORE/second-paddle-notes'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Run exact dependency versions on reduced examples
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/normalizer-control"
          rustup toolchain install 1.93.1 --profile minimal
          rustc +1.93.1 -Vv > "$RUNNER_TEMP/normalizer-control/rustc.txt"
          cd checks/tokenizers-2466-unicode/normalizer-control
          cargo +1.93.1 run --quiet > "$RUNNER_TEMP/normalizer-control/result.json" 2> "$RUNNER_TEMP/normalizer-control/cargo.stderr"
          cp Cargo.lock "$RUNNER_TEMP/normalizer-control/Cargo.lock"
          cat "$RUNNER_TEMP/normalizer-control/result.json"
      - name: Retain results and any failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: normalizer-control-${{ github.run_id }}
          path: ${{ runner.temp }}/normalizer-control
          retention-days: 30
          if-no-files-found: error
