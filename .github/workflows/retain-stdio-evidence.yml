name: Preserve fixed PR35 evidence without rerunning MCP
'on':
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'contributions/stdio-evidence-capsule/**'
      - '.github/workflows/retain-stdio-evidence.yml'
permissions:
  contents: read
jobs:
  retain:
    if: github.repository == 'YS-OH-CORE/second-paddle-notes' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'zero/retain-stdio-evidence-20260914'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Rebuild pinned records, test, repair only the known copy, read it back
        shell: bash
        env:
          GH_RETENTION_TOKEN: ${{ github.token }}
          RETENTION_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          RETENTION_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          python -S contributions/stdio-evidence-capsule/retain_from_artifacts.py --publish 2>&1 | tee "$RUNNER_TEMP/retention.log"
      - name: Retain this inspection log
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stdio-evidence-retention
          path: ${{ runner.temp }}/retention.log
          if-no-files-found: error
          retention-days: 14
