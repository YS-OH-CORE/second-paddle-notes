name: Rule-use smoke evaluation

on:
  push:
    paths:
      - "experiments/rule-use-eval/**"
      - ".github/workflows/rule-use-eval.yml"
  pull_request:
    paths:
      - "experiments/rule-use-eval/**"
      - ".github/workflows/rule-use-eval.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check generated dataset
        working-directory: experiments/rule-use-eval
        run: python build_dataset.py --check
      - name: Run unit tests
        working-directory: experiments/rule-use-eval
        run: python -m unittest discover -s tests -v
      - name: Check offline model-study dry run
        working-directory: experiments/rule-use-eval/model_eval
        run: |
          python run_public_smoke_dry_run.py --check
          python -m unittest discover -s tests -v
      - name: Check SHA-256 manifest
        working-directory: experiments/rule-use-eval
        run: python generate_manifest.py --check
