name: Check consolidated lifecycle through inbound finalizers
on:
  pull_request:
    paths:
      - 'contributions/hermes-salvage-integration/**'
      - '.github/workflows/hermes-salvage-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read contribution
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: contribution
          persist-credentials: false
      - name: Read exact earlier candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: JoaoMarcos44/hermes-agent
          ref: b2f009d4f289597a5eace6b9c7a169901c3a5af8
          path: base
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Read exact consolidated candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: kshitijk4poor/hermes-agent
          ref: c9122c0cc9544653611d1e2c5151f77bb41a743d
          path: head
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Prepare isolated dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/integration-env"
          "$RUNNER_TEMP/integration-env/bin/python" -m pip install --disable-pip-version-check pytest==8.4.2 pytest-asyncio==1.2.0 python-dotenv==1.2.2 pyyaml==6.0.3 rich==14.3.3 openai==2.24.0 requests==2.33.0 tenacity==9.1.4 croniter==6.0.0 prompt_toolkit==3.0.52 fire==0.7.1 psutil==7.2.2
      - name: Execute new integration and unchanged adjacent tests
        run: |
          "$RUNNER_TEMP/integration-env/bin/python" contribution/contributions/hermes-salvage-integration/verify.py --base base --head head --out "$RUNNER_TEMP/salvage-evidence"
      - name: Retain observed test results only
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hermes-salvage-integration-evidence
          path: |
            ${{ runner.temp }}/salvage-evidence/*.json
            ${{ runner.temp }}/salvage-evidence/*.jsonl
            ${{ runner.temp }}/salvage-evidence/*.xml
            ${{ runner.temp }}/salvage-evidence/*.txt
          if-no-files-found: warn
          retention-days: 14
