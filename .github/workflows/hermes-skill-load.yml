name: Load the reconciliation skill through pinned Hermes handlers
'on':
  pull_request:
    paths:
      - 'contributions/hermes-skill-load/**'
      - '.github/workflows/hermes-skill-load.yml'
permissions:
  contents: read
jobs:
  host-load:
    if: github.repository == 'YS-OH-CORE/second-paddle-notes' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: NousResearch/hermes-agent
          ref: 65a6b6831ef681da73955dd97a44f35794a2d4b9
          path: upstream-hermes
          persist-credentials: false
          sparse-checkout: |
            agent
            tools
            hermes_cli
            gateway
            plugins
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Prepare the small skill-loading dependency set
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/skill-host-venv"
          "$RUNNER_TEMP/skill-host-venv/bin/python" -m pip install --disable-pip-version-check PyYAML==6.0.3 python-dotenv==1.2.2 rich==14.3.3 prompt_toolkit==3.0.52 Jinja2==3.1.6
          "$RUNNER_TEMP/skill-host-venv/bin/python" -m pip freeze > "$RUNNER_TEMP/skill-host-dependencies.txt"
      - name: Exercise actual handlers with isolated profiles and no model
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s "$RUNNER_TEMP/skill-host-venv/bin/python" -B contributions/hermes-skill-load/probe.py --upstream "$GITHUB_WORKSPACE/upstream-hermes" --skill "$GITHUB_WORKSPACE/skills/github-write-reconcile" --out "$RUNNER_TEMP/skill-host-evidence" 2>&1 | tee "$RUNNER_TEMP/skill-host.log"
      - name: Retain observations, never profile state
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hermes-skill-load
          path: |
            ${{ runner.temp }}/skill-host-evidence/*.json
            ${{ runner.temp }}/skill-host-evidence/*.log
            ${{ runner.temp }}/skill-host-dependencies.txt
            ${{ runner.temp }}/skill-host.log
          if-no-files-found: error
          retention-days: 14
