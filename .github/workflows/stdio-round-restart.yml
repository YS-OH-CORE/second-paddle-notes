name: Reconnect actual MCP stdio after client and server restart
'on':
  pull_request:
    paths:
      - 'contributions/stdio-round-restart/**'
      - 'contributions/preserved-mcp-rounds/round_graph.py'
      - 'contributions/preserved-mcp-rounds/requirements.txt'
      - '.github/workflows/stdio-round-restart.yml'
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  stdio-restart:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      LANGSMITH_TRACING: 'false'
      LANGCHAIN_TRACING_V2: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install fixed SDK versions
        run: |
          python -m venv "$RUNNER_TEMP/stdio-venv"
          "$RUNNER_TEMP/stdio-venv/bin/python" -m pip install --disable-pip-version-check -r contributions/preserved-mcp-rounds/requirements.txt
          "$RUNNER_TEMP/stdio-venv/bin/python" -m pip freeze > "$RUNNER_TEMP/stdio-dependencies.txt"
      - name: Check source and fixture store
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/stdio-venv/bin/python" -m py_compile contributions/stdio-round-restart/*.py
          (cd contributions/stdio-round-restart && "$RUNNER_TEMP/stdio-venv/bin/python" -m unittest -v test_store) 2>&1 | tee "$RUNNER_TEMP/stdio-unit.log"
      - name: Exercise four real stdio restart paths
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/stdio-venv/bin/python" contributions/stdio-round-restart/stdio_restart_probe.py --root "$RUNNER_TEMP/stdio-evidence" 2>&1 | tee "$RUNNER_TEMP/stdio-probe.log"
      - name: Retain synthetic records, never the databases
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stdio-round-restart
          path: |
            ${{ runner.temp }}/stdio-evidence/observations.json
            ${{ runner.temp }}/stdio-evidence/*/*.json
            ${{ runner.temp }}/stdio-evidence/*/*.jsonl
            ${{ runner.temp }}/stdio-evidence/*/*.log
            ${{ runner.temp }}/stdio-dependencies.txt
            ${{ runner.temp }}/stdio-unit.log
            ${{ runner.temp }}/stdio-probe.log
          if-no-files-found: error
          retention-days: 14
