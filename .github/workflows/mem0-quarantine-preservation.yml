name: Mem0 evidence preservation under open failures
on:
  push:
    branches: ['verify/mem0-quarantine-preservation-20261006']
    paths:
      - '.github/workflows/mem0-quarantine-preservation.yml'
      - 'checks/mem0-quarantine-20261006/compare.py'
permissions:
  contents: read
jobs:
  compare:
    if: github.repository == 'YS-OH-CORE/second-paddle-notes'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Compare real SQLite and filesystem behavior
        run: python checks/mem0-quarantine-20261006/compare.py
        env:
          MEM0_TELEMETRY: 'false'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mem0-quarantine-${{ github.run_id }}
          path: results
          retention-days: 14
          if-no-files-found: error
