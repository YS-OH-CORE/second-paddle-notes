name: Check proposed Hermes replay status patch
on:
  pull_request:
    paths:
      - 'contributions/hermes-replay-status/**'
      - '.github/workflows/hermes-replay-status.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read this patch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: contribution
          persist-credentials: false
      - name: Read pinned public upstream source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: NousResearch/hermes-agent
          ref: 6c3d4a4af70d76b7365bf19e9420ffdcbb9830ad
          path: upstream
          persist-credentials: false
          lfs: false
          submodules: false
      - name: Prepare isolated test dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/test-venv"
          "$RUNNER_TEMP/test-venv/bin/python" -m pip install --disable-pip-version-check pytest==8.4.2 python-dotenv==1.2.2 pyyaml==6.0.3 rich==14.3.3 openai==2.24.0 requests==2.33.0 tenacity==9.1.4
      - name: Compare original and patched code through real imports
        run: |
          "$RUNNER_TEMP/test-venv/bin/python" contribution/contributions/hermes-replay-status/verify_patch.py --upstream upstream --out "$RUNNER_TEMP/replay-evidence"
      - name: Keep actual assertion results
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hermes-replay-status-evidence
          path: |
            ${{ runner.temp }}/replay-evidence/*.json
            ${{ runner.temp }}/replay-evidence/*.jsonl
            ${{ runner.temp }}/replay-evidence/*.xml
            ${{ runner.temp }}/replay-evidence/*.txt
          if-no-files-found: warn
          retention-days: 30
