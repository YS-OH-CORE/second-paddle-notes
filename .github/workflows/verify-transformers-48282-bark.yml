name: Transformers 48282 Bark configuration check

on:
  push:
    branches: ['verify/transformers-48282-bark-20260929']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  configuration:
    if: github.repository == 'YS-OH-CORE/second-paddle-notes'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: evidence
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: huggingface/transformers
          ref: 2e703d6c7e81ec584c25edc39e8bd2f5a45b04bd
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: huggingface/transformers
          ref: f3e3ad778c38990d38100c44c74f2054b9b2aae6
          path: candidate
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: '0.9.28'
          enable-cache: false
      - name: Install one shared CPU environment
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/transformers-48282-bark"
          uv venv --python 3.12 "$RUNNER_TEMP/bark-venv"
          uv pip install --python "$RUNNER_TEMP/bark-venv/bin/python" --torch-backend cpu \
            --editable ./candidate torch==2.13.0 \
            2>&1 | tee "$RUNNER_TEMP/transformers-48282-bark/install.log"
          uv pip freeze --python "$RUNNER_TEMP/bark-venv/bin/python" \
            > "$RUNNER_TEMP/transformers-48282-bark/packages.txt"
      - name: Compare baseline, candidate, and diagnostic patch
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/bark-venv/bin/python" evidence/checks/transformers-48282-bark/run.py \
            --base baseline --head candidate --output "$RUNNER_TEMP/transformers-48282-bark" \
            2>&1 | tee "$RUNNER_TEMP/transformers-48282-bark/run.log"
      - name: Preserve all phase and setup receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: transformers-48282-bark-attempt1
          path: ${{ runner.temp }}/transformers-48282-bark
          retention-days: 30
          if-no-files-found: error
