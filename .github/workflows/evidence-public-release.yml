name: Publish the tested evidence wheel and verify public use
on:
  pull_request:
    paths:
      - 'releases/evidence-0.1.0a1/**'
      - '.github/workflows/evidence-public-release.yml'
  push:
    branches: [main]
    paths:
      - 'releases/evidence-0.1.0a1/**'
      - '.github/workflows/evidence-public-release.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: evidence-v0.1.0a1-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'YS-OH-CORE/second-paddle-notes'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Retrieve exact previously tested files and validate them
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 releases/evidence-0.1.0a1/promote.py prepare --out "$RUNNER_TEMP/public-assets"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: evidence-public-assets
          path: ${{ runner.temp }}/public-assets/
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: prepare
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.repository == 'YS-OH-CORE/second-paddle-notes'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Read only the asset artifact from this exact run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name evidence-public-assets --dir "$RUNNER_TEMP/public-assets"
      - name: Create the fixed prerelease without replacing existing files
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 releases/evidence-0.1.0a1/promote.py publish --out "$RUNNER_TEMP/public-assets" --notes releases/evidence-0.1.0a1/NOTES.md
  public_consumer:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Download actual public assets without login or token
        run: python releases/evidence-0.1.0a1/promote.py public-readback --out "$RUNNER_TEMP/public-assets"
      - name: Install the publicly downloaded wheel in an isolated environment
        run: python packages/evidence-mcp/verify_install.py --wheel "$RUNNER_TEMP/public-assets/second_paddle_evidence-0.1.0a1-py3-none-any.whl" --out "$RUNNER_TEMP/public-install"
      - name: Retain public-download and installed-consumer observations
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: evidence-public-consumer
          path: |
            ${{ runner.temp }}/public-readback.json
            ${{ runner.temp }}/public-assets/*
            ${{ runner.temp }}/public-install/*.json
            ${{ runner.temp }}/public-install/*.log
          if-no-files-found: warn
          retention-days: 14
