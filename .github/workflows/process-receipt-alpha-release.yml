name: Publish fixed Process Receipt 0.2.0a1
on:
  pull_request:
    paths:
      - 'releases/process-receipt-v0.2.0a1/**'
      - '.github/workflows/process-receipt-alpha-release.yml'
  push:
    branches: [main]
    paths:
      - 'releases/process-receipt-v0.2.0a1/**'
      - '.github/workflows/process-receipt-alpha-release.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: process-receipt-0.2.0a1-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Offline publication-state tests
        run: python3 -m unittest discover -s releases/process-receipt-v0.2.0a1 -p 'test_*.py' -v
      - name: Read and validate only the previously tested artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 releases/process-receipt-v0.2.0a1/publish.py --prepare --out "$RUNNER_TEMP/alpha-preflight"
      - name: Retain preflight evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: alpha-preflight
          path: ${{ runner.temp }}/alpha-preflight/preflight.json
          if-no-files-found: warn
          retention-days: 14
  publish:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'YS-OH-CORE/second-paddle-notes'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Promote exact alpha wheel without rebuild or asset replacement
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 releases/process-receipt-v0.2.0a1/publish.py --publish --out "$RUNNER_TEMP/alpha-publication"
      - name: Retain publication receipt without credentials
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: alpha-publication
          path: |
            ${{ runner.temp }}/alpha-publication/publication.json
            ${{ runner.temp }}/alpha-publication/draft-checkpoint.json
            ${{ runner.temp }}/alpha-publication/preflight.json
          if-no-files-found: warn
          retention-days: 14
  consumer:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Public unauthenticated download, fresh install and actual use
        run: python releases/process-receipt-v0.2.0a1/consume.py --out "${{ runner.temp }}/alpha-consumer"
      - name: Retain actual consumer outputs, not the environment
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: alpha-consumer-${{ runner.os }}
          path: |
            ${{ runner.temp }}/alpha-consumer/*.json
            ${{ runner.temp }}/alpha-consumer/*.txt
            ${{ runner.temp }}/alpha-consumer/outside-source/
          if-no-files-found: warn
          retention-days: 14
