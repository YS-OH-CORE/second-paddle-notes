name: Publish the checked GitHub reconciliation skill preview
'on':
  pull_request:
    paths:
      - 'packages/reconcile-skill/**'
      - '.github/workflows/reconcile-skill-release.yml'
permissions:
  contents: read
jobs:
  publish:
    if: github.repository == 'YS-OH-CORE/second-paddle-notes' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'zero/reconcile-skill-release-20260914'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Assemble, verify, publish one preview, check public acquisition
        shell: bash
        env:
          RELEASE_TOKEN: ${{ github.token }}
          RELEASE_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          RELEASE_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          RELEASE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          export RELEASE_OUT="$RUNNER_TEMP/reconcile-release"
          timeout 240s python -B -S packages/reconcile-skill/publish.py 2>&1 | tee "$RUNNER_TEMP/reconcile-publication.log"
      - name: Retain publication evidence and the exact public assets
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reconcile-skill-publication
          path: |
            ${{ runner.temp }}/reconcile-release/*
            ${{ runner.temp }}/reconcile-publication.log
          if-no-files-found: error
          retention-days: 14
