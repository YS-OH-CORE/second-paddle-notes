name: Install evidence tools outside the checkout
on:
  pull_request:
    paths:
      - 'packages/evidence-mcp/**'
      - '.github/workflows/evidence-wheel.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Build identical wheel twice and install into a new environment
        shell: python
        run: |
          import hashlib, os, pathlib, subprocess, sys
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          build = pathlib.Path('packages/evidence-mcp/build_wheel.py').resolve()
          for name in ('wheel-dist', 'wheel-rebuild'):
              subprocess.run([sys.executable, str(build), '--out', str(temp/name)], check=True)
          wheel = next((temp/'wheel-dist').glob('*.whl'))
          rebuilt = next((temp/'wheel-rebuild').glob('*.whl'))
          assert wheel.read_bytes() == rebuilt.read_bytes()
          assert hashlib.sha256(wheel.read_bytes()).hexdigest() == 'b801b9f2f8fe6973c980161d0ee2ff0241eada55b313c1b635a90d13eb6425ff'
          subprocess.run([sys.executable, 'packages/evidence-mcp/verify_install.py', '--wheel', str(wheel), '--out', str(temp/'wheel-evidence')], check=True)
      - name: Retain only the wheel and synthetic installation observations
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: evidence-wheel-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/wheel-dist/*.whl
            ${{ runner.temp }}/wheel-evidence/*.json
            ${{ runner.temp }}/wheel-evidence/*.log
          if-no-files-found: warn
          retention-days: 14
