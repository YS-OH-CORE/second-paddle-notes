name: Review displaced generation cleanup
on:
  pull_request:
    paths:
      - 'contributions/hermes-generation-review/**'
      - '.github/workflows/hermes-generation-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read contribution
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: contribution
          persist-credentials: false
      - name: Read exact parent source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: JoaoMarcos44/hermes-agent
          ref: 2b1c0ae586e7bf4c51cc0cbe61eff4ec0190be03
          path: parent
          persist-credentials: false
          lfs: false
          submodules: false
      - name: Read exact repaired source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: JoaoMarcos44/hermes-agent
          ref: b2f009d4f289597a5eace6b9c7a169901c3a5af8
          path: head
          persist-credentials: false
          lfs: false
          submodules: false
      - name: Prepare isolated test dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/review-venv"
          "$RUNNER_TEMP/review-venv/bin/python" -m pip install --disable-pip-version-check pytest==8.4.2 pytest-asyncio==1.2.0 python-dotenv==1.2.2 pyyaml==6.0.3 rich==14.3.3 openai==2.24.0 requests==2.33.0 tenacity==9.1.4 croniter==6.0.0 prompt_toolkit==3.0.52 fire==0.7.1 psutil==7.2.2
      - name: Compare original and repaired ownership helpers
        run: |
          "$RUNNER_TEMP/review-venv/bin/python" contribution/contributions/hermes-generation-review/verify.py --parent parent --head head --out "$RUNNER_TEMP/generation-evidence"
      - name: Retain assertion evidence only
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hermes-generation-review-evidence
          path: |
            ${{ runner.temp }}/generation-evidence/*.json
            ${{ runner.temp }}/generation-evidence/*.jsonl
            ${{ runner.temp }}/generation-evidence/*.xml
            ${{ runner.temp }}/generation-evidence/*.txt
          if-no-files-found: warn
          retention-days: 30
