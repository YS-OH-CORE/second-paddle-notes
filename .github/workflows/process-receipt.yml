name: Process receipt checks
on:
  push:
    branches: [main]
    paths:
      - 'tools/process-receipt/**'
      - '.github/workflows/process-receipt.yml'
  pull_request:
    paths:
      - 'tools/process-receipt/**'
      - '.github/workflows/process-receipt.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Read the unchanged alpha baseline
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 77066648841c441e6f10d53dbab612f596966d37
          path: .receipt-baseline
          persist-credentials: false
      - name: Compare final receipt I/O failures with real owned-child effects
        run: python tools/process-receipt/verify_persistence.py --baseline .receipt-baseline/tools/process-receipt --candidate tools/process-receipt --out "${{ runner.temp }}/receipt-io-evidence"
      - name: Preserve original POSIX regressions
        if: runner.os == 'Linux'
        run: python -m unittest discover -s tools/process-receipt -p test_process_receipt.py -v
      - name: Preserve original POSIX inert-process demonstrations
        if: runner.os == 'Linux'
        run: python tools/process-receipt/demo.py --out "$RUNNER_TEMP/process-receipt-demo"
      - name: Build and verify native offline installation outside source
        run: python tools/process-receipt/build_native.py
      - name: Retain platform-specific wheel and observed receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: process-receipt-native-${{ runner.os }}
          path: |
            ${{ runner.temp }}/process-native-build/dist/*.whl
            ${{ runner.temp }}/process-native-build/installation/results/
            ${{ runner.temp }}/process-receipt-demo/
            ${{ runner.temp }}/receipt-io-evidence/*.json
            ${{ runner.temp }}/receipt-io-evidence/*.jsonl
            ${{ runner.temp }}/receipt-io-evidence/*.txt
          if-no-files-found: warn
          retention-days: 14
