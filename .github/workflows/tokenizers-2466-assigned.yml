name: Tokenizers 2466 assigned repertoire and NFC expectations
on:
  push:
    branches: ['verify/tokenizers-2466-assigned-20260929']
permissions:
  contents: read
jobs:
  check:
    if: github.repository == 'YS-OH-CORE/second-paddle-notes'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: evidence
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: huggingface/tokenizers
          ref: cde465c9580a0b3f6831318539e3ff2360c7fb09
          path: source
          persist-credentials: false
      - name: Pin toolchain
        run: rustup toolchain install 1.93.1 --profile minimal
      - name: Check independent expectations and real tokenizer outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/assigned-receipts"
          python3 evidence/checks/tokenizers-2466-assigned/run.py source "$RUNNER_TEMP/assigned-receipts" 2>&1 | tee "$RUNNER_TEMP/assigned-receipts/driver.log"
      - name: Retain all outputs including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tokenizers-assigned-${{ github.run_id }}
          path: ${{ runner.temp }}/assigned-receipts
          retention-days: 30
          if-no-files-found: error
