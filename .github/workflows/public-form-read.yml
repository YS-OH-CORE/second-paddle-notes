name: Public source form read (one shot)
'on':
  push:
    branches: [ops/public-form-read-20260919]
    paths: [ops/form-read.request.json]
permissions: {}
concurrency:
  group: zero-public-form-read-20260919
  cancel-in-progress: false
jobs:
  read-public-pages:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Install pinned driver in disposable runner
        run: python -m pip install --disable-pip-version-check --no-cache-dir playwright==1.51.0
      - name: Read exact public source
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          curl --fail --location --max-time 30 "https://raw.githubusercontent.com/YS-OH-CORE/second-paddle-notes/${SOURCE_SHA}/read_public_form.py" -o reader.py
          echo 'a568136303b70b054c8a4ec721266e4e46698545fdef380dbab9dc968c8be24a  reader.py' | sha256sum --check
          python -B -u reader.py
