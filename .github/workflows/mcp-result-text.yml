name: Check structured tool-result fallback
on:
  pull_request:
    paths:
      - 'tools/mcp-result-text/**'
      - '.github/workflows/mcp-result-text.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare published SDK in an isolated environment
        run: |
          python3 -m venv "$RUNNER_TEMP/result-venv"
          "$RUNNER_TEMP/result-venv/bin/python" -m pip install --disable-pip-version-check 'mcp==2.2.0'
          "$RUNNER_TEMP/result-venv/bin/python" -m pip freeze > "$RUNNER_TEMP/result-dependencies.txt"
      - name: Run independent-copy and empty-result checks
        working-directory: tools/mcp-result-text
        run: |
          set -o pipefail
          "$RUNNER_TEMP/result-venv/bin/python" -m unittest -v test_result_text 2>&1 | tee "$RUNNER_TEMP/result-unit.log"
      - name: Call actual stdio servers and apply the consumer adapter
        run: |
          set -o pipefail
          "$RUNNER_TEMP/result-venv/bin/python" tools/mcp-result-text/stdio_roundtrip.py --out "$RUNNER_TEMP/result-evidence" 2>&1 | tee "$RUNNER_TEMP/result-integration.log"
      - name: Preserve synthetic responses and execution records
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mcp-result-text-evidence
          path: |
            ${{ runner.temp }}/result-evidence/
            ${{ runner.temp }}/result-unit.log
            ${{ runner.temp }}/result-integration.log
            ${{ runner.temp }}/result-dependencies.txt
          if-no-files-found: warn
          retention-days: 14
