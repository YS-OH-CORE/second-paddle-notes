name: Pydantic boolean-def semantics (one shot)
'on':
  push:
    branches: [ops/pydantic-8621-20260923]
    paths: [.github/workflows/pydantic-8621-20260923.yml]
permissions: {}
concurrency:
  group: zero-pydantic-8621-20260923
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Prepare a pinned environment tool
        run: |
          python3 -m venv "$RUNNER_TEMP/zero-bootstrap"
          "$RUNNER_TEMP/zero-bootstrap/bin/python" -m pip install --disable-pip-version-check --no-cache-dir uv==0.12.17
      - name: Compare actual generic transformer with two local candidate interpretations
        run: |
          "$RUNNER_TEMP/zero-bootstrap/bin/python" -B -u - <<'PY'
          import ast, hashlib, os, pathlib, subprocess, urllib.request
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'zero-pydantic-8621'
          root.mkdir(exist_ok=False)
          repo=root/'source';repo.mkdir()
          home=root/'home';home.mkdir()
          env={'PATH':os.environ['PATH'],'HOME':str(home),'LANG':'C.UTF-8',
               'PYTHONDONTWRITEBYTECODE':'1','UV_NO_PROGRESS':'1',
               'UV_PYTHON_DOWNLOADS':'never','UV_CACHE_DIR':str(root/'uv-cache'),
               'OTEL_SDK_DISABLED':'true','LOGFIRE_SEND_TO_LOGFIRE':'false'}
          def call(argv,timeout=90):
              p=subprocess.run(list(map(str,argv)),cwd=repo,env=env,text=True,capture_output=True,timeout=timeout)
              print('COMMAND '+str(argv)+'\n'+p.stdout[-32000:]+'\n'+p.stderr[-6000:],flush=True)
              p.check_returncode()
              return p.stdout
          target='06be8e7a0056d6c6c72d2868f6b26ee8e7364c77'
          call(['git','init','-q'])
          call(['git','fetch','--depth=1','https://github.com/pydantic/pydantic-ai.git',target])
          call(['git','checkout','--detach','FETCH_HEAD'])
          assert call(['git','rev-parse','HEAD']).strip()==target
          uv=pathlib.Path(os.environ['RUNNER_TEMP'])/'zero-bootstrap/bin/uv'
          call([uv,'sync','--frozen','--package','pydantic-ai-slim','--no-default-groups','--python','3.12'],210)
          python=repo/'.venv/bin/python'
          call([uv,'pip','install','--python',python,'jsonschema==4.25.1'],60)
          call([uv,'pip','freeze','--python',python])
          url='https://raw.githubusercontent.com/YS-OH-CORE/second-paddle-notes/1b21a58b05031f778ae8a4c4eaacb29d768a7981/checks/pydantic-8621/check_boolean_defs.py'
          with urllib.request.urlopen(url,timeout=20) as response:
              raw=response.read(15000)
          assert hashlib.sha256(raw).hexdigest()=='58d0052ce2529c4428a14972d8f494c3a160b272b24692a77748555836c36343'
          ast.parse(raw)
          script=root/'check_boolean_defs.py';script.write_bytes(raw)
          print('PINNED_WORKFLOW '+os.environ['GITHUB_SHA'],flush=True)
          call([python,'-B','-u',script,'--repo',repo,'--result',root/'result.json'],120)
          assert call(['git','status','--porcelain']).strip()==''
          PY
