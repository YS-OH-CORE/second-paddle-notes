name: Realtime ownership observation (not a fix)
'on':
  push:
    branches: [ops/agents5072-identity-20260923]
    paths: [.github/workflows/agents5072-identity-20260923.yml]
permissions: {}
concurrency:
  group: zero-agents5072-identity-20260923
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Prepare pinned environment tool
        run: |
          python3 -m venv "$RUNNER_TEMP/zero-bootstrap"
          "$RUNNER_TEMP/zero-bootstrap/bin/python" -m pip install --disable-pip-version-check --no-cache-dir uv==0.12.17
      - name: Observe unmodified SDK through its public session iterator
        run: |
          "$RUNNER_TEMP/zero-bootstrap/bin/python" -B -u - <<'PY'
          import ast, hashlib, os, pathlib, subprocess, urllib.request
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'zero-agents5072'
          root.mkdir(exist_ok=False)
          repo=root/'source';repo.mkdir()
          home=root/'home';home.mkdir()
          env={'PATH':os.environ['PATH'],'HOME':str(home),'LANG':'C.UTF-8',
               'PYTHONDONTWRITEBYTECODE':'1','UV_NO_PROGRESS':'1',
               'UV_PYTHON_DOWNLOADS':'never','UV_CACHE_DIR':str(root/'uv-cache'),
               'OPENAI_AGENTS_DISABLE_TRACING':'1','OTEL_SDK_DISABLED':'true'}
          def call(argv,timeout=60):
              p=subprocess.run(list(map(str,argv)),cwd=repo,env=env,text=True,capture_output=True,timeout=timeout)
              print('COMMAND '+str(argv)+'\n'+p.stdout[-20000:]+'\n'+p.stderr[-5000:],flush=True)
              p.check_returncode()
              return p.stdout
          target='32edd3c3ecde37a7fb6bf4b082f35f1d8f7f086b'
          call(['git','init','-q'])
          call(['git','fetch','--depth=1','https://github.com/openai/openai-agents-python.git',target],90)
          call(['git','checkout','--detach','FETCH_HEAD'])
          assert call(['git','rev-parse','HEAD']).strip()==target
          uv=pathlib.Path(os.environ['RUNNER_TEMP'])/'zero-bootstrap/bin/uv'
          call([uv,'sync','--frozen','--no-default-groups','--python','3.12'],180)
          python=repo/'.venv/bin/python'
          call([uv,'pip','freeze','--python',python])
          url='https://raw.githubusercontent.com/YS-OH-CORE/second-paddle-notes/f8dec3d4fd6be609972c14241f41670198aef9db/checks/agents5072/check_turn_identity.py'
          with urllib.request.urlopen(url,timeout=20) as r:
              raw=r.read(15000)
          assert hashlib.sha256(raw).hexdigest()=='a43c3f37eb36f34414639c76a8426afd07aa9993ebfc92843f3ebd19c82a3615'
          ast.parse(raw)
          script=root/'check_turn_identity.py';script.write_bytes(raw)
          print('PINNED_WORKFLOW '+os.environ['GITHUB_SHA'],flush=True)
          call([python,'-B','-u',script,'--repo',repo],60)
          assert call(['git','status','--porcelain']).strip()==''
          PY
