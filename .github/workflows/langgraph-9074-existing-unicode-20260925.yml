name: Existing checkpoint Unicode filter check
'on':
  push:
    branches: [ops/langgraph-9074-existing-unicode-20260925]
    paths: [.github/workflows/langgraph-9074-existing-unicode-20260925.yml]
permissions: {}
concurrency:
  group: zero-langgraph-9074-unicode-20260925
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Save once using base, reopen read-only with base and proposed query fix
        run: |
          python3 -B -u - <<'PY'
          import ast,hashlib,json,os,pathlib,shutil,subprocess,urllib.request
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'zero-langgraph-9074-unicode'
          root.mkdir(exist_ok=False)
          src=root/'source';src.mkdir();out=root/'output';out.mkdir();home=root/'home';home.mkdir()
          env={'PATH':os.environ['PATH'],'HOME':str(home),'LANG':'C.UTF-8','PYTHONDONTWRITEBYTECODE':'1',
               'GIT_LFS_SKIP_SMUDGE':'1','PIP_DISABLE_PIP_VERSION_CHECK':'1',
               'LANGSMITH_TRACING':'false','LANGCHAIN_TRACING_V2':'false'}
          def call(args,timeout=60):
              p=subprocess.run(list(map(str,args)),cwd=src,env=env,text=True,capture_output=True,timeout=timeout)
              with (out/'execution.log').open('a',encoding='utf-8') as f:
                  f.write('COMMAND '+str(args)+'\n'+p.stdout+'\n'+p.stderr+'\n')
              print(p.stdout[-35000:]+p.stderr[-4000:],flush=True)
              p.check_returncode()
              return p.stdout
          ref='7daa3ab49d678a5da75edb08baa87db4a2be52c3'
          call(['git','init','-q'])
          call(['git','fetch','--depth=1','https://github.com/langchain-ai/langgraph.git',ref])
          call(['git','checkout','--detach','FETCH_HEAD'])
          assert call(['git','rev-parse','HEAD']).strip()==ref
          shutil.copyfile(src/'libs/checkpoint-sqlite/LICENSE',out/'LANGGRAPH_LICENSE')
          call(['python3','-m','venv',root/'venv'])
          py=root/'venv/bin/python'
          call([py,'-m','pip','install','--no-cache-dir',src/'libs/checkpoint',src/'libs/checkpoint-sqlite'],160)
          (out/'environment.txt').write_text(call([py,'-m','pip','freeze','--all']),encoding='utf-8')
          script_ref='bb7002b398b2f4e0e5cfcdec7c3a128399a78660'
          url=f'https://raw.githubusercontent.com/YS-OH-CORE/second-paddle-notes/{script_ref}/checks/langgraph-9074/check_existing_metadata.py'
          with urllib.request.urlopen(url,timeout=20) as r:raw=r.read(30000)
          assert hashlib.sha256(raw).hexdigest()=='79ca815aa529d994250fd40e233bc0473a962a2002065d3a61eb91df68b83fe3'
          ast.parse(raw)
          script=out/'check_existing_metadata.py';script.write_bytes(raw)
          (out/'metadata.json').write_text(json.dumps({'run_id':os.environ['GITHUB_RUN_ID'],
              'workflow_commit':os.environ['GITHUB_SHA'],'source_commit':ref,'script_commit':script_ref,
              'script_sha256':hashlib.sha256(raw).hexdigest()},indent=2),encoding='utf-8')
          call([py,'-B','-u',script,'--repo',src,'--out',out/'fixture'],110)
          assert call(['git','diff','--exit-code']).strip()==''
          PY
      - name: Retain synthetic databases, source patch and actual observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zero-langgraph-9074-unicode-20260925
          path: ${{ runner.temp }}/zero-langgraph-9074-unicode/output/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
