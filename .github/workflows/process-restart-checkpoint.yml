name: Reopen an MCP form checkpoint in a fresh Python process
on:
  pull_request:
    paths:
      - 'contributions/preserved-mcp-rounds/**'
      - '.github/workflows/process-restart-checkpoint.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  restart:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install the same fixed packages as the preserved-round probe
        run: |
          python -m venv "$RUNNER_TEMP/restart-venv"
          "$RUNNER_TEMP/restart-venv/bin/python" -m pip install --disable-pip-version-check -r contributions/preserved-mcp-rounds/requirements.txt
      - name: Compile the probe
        run: "$RUNNER_TEMP/restart-venv/bin/python" -m py_compile contributions/preserved-mcp-rounds/process_restart_probe.py
      - name: Exit process A and resume in process B
        run: |
          "$RUNNER_TEMP/restart-venv/bin/python" contributions/preserved-mcp-rounds/process_restart_probe.py --out "$RUNNER_TEMP/process-restart-evidence" | tee "$RUNNER_TEMP/process-restart.log"
      - name: Retain synthetic evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: process-restart-checkpoint
          path: |
            ${{ runner.temp }}/process-restart-evidence/process_restart.json
            ${{ runner.temp }}/process-restart.log
          if-no-files-found: warn
          retention-days: 14
