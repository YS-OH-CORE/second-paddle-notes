name: Observe elicitation question identity across resume
on:
  pull_request:
    paths:
      - 'contributions/langchain-elicitation-identity/**'
      - '.github/workflows/langchain-elicitation-identity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install the fixed published dependency set
        run: |
          python -m venv "$RUNNER_TEMP/identity-python"
          "$RUNNER_TEMP/identity-python/bin/python" -m pip install --disable-pip-version-check "langchain[mcp]==1.4.0" "langchain-core==1.6.2" "langgraph==1.2.11" "fastmcp==4.0.1" "mcp==2.1.1"
          "$RUNNER_TEMP/identity-python/bin/python" -m pip check
          "$RUNNER_TEMP/identity-python/bin/python" -m pip freeze > "$RUNNER_TEMP/identity-dependencies.txt"
      - name: Run only synthetic in-memory previews with no tracing or credentials
        run: |
          set -o pipefail
          mkdir "$RUNNER_TEMP/identity-home"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/identity-home" LANGSMITH_TRACING=false LANGCHAIN_TRACING_V2=false PYTHONDONTWRITEBYTECODE=1 "$RUNNER_TEMP/identity-python/bin/python" contributions/langchain-elicitation-identity/reproduce.py --out "$RUNNER_TEMP/identity-evidence" 2>&1 | tee "$RUNNER_TEMP/identity-run.txt"
      - name: Preserve actual observations including unsuccessful controls
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: langchain-elicitation-identity
          path: |
            ${{ runner.temp }}/identity-evidence/
            ${{ runner.temp }}/identity-dependencies.txt
            ${{ runner.temp }}/identity-run.txt
          if-no-files-found: warn
          retention-days: 14
