name: Eight-cell adequacy and prior-content diagnostic
'on':
  pull_request:
    types: [synchronize]
    paths:
      - 'experiments/generation-feedback-pilot/adequacy/probe.py'
      - 'experiments/generation-feedback-pilot/adequacy/PLAN.md'
      - 'experiments/generation-feedback-pilot/adequacy/MANIFEST.json'
      - '.github/workflows/adequacy-diagnostic.yml'
permissions:
  contents: read
jobs:
  one-diagnostic:
    if: github.repository == 'YS-OH-CORE/second-paddle-notes' && github.event.repository.private == false && github.event.pull_request.number == 57 && github.event.before == '7d9064d4e90a45e999ef97b1ecb9dc84d51646d2' && github.run_attempt == 1 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/generation-feedback-pilot-20260928'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Check all fixed diagnostic cells
        run: python -B experiments/generation-feedback-pilot/adequacy/probe.py --check
      - name: Prepare disposable CPU runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/diagnostic-venv"
          "$RUNNER_TEMP/diagnostic-venv/bin/pip" install --only-binary=:all: --index-url https://download.pytorch.org/whl/cpu 'torch==2.10.0'
          "$RUNNER_TEMP/diagnostic-venv/bin/pip" install --only-binary=:all: 'transformers==4.57.1' 'tokenizers==0.22.1' 'huggingface-hub==0.36.0' 'safetensors==0.6.2' 'numpy==2.2.6'
      - name: Run the eight predeclared responses once
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          HF_HOME: ${{ runner.temp }}/adequacy-hf
          HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
        run: timeout 490s "$RUNNER_TEMP/diagnostic-venv/bin/python" -u -B experiments/generation-feedback-pilot/adequacy/probe.py --run
