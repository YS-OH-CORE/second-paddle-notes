name: Assess upstream replay correction and explicit residuals
on:
  pull_request:
    paths:
      - 'contributions/hermes-replay-upstream-review/**'
      - '.github/workflows/hermes-replay-upstream-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assess:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read contribution and unchanged prior fixtures
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: contribution
          persist-credentials: false
      - name: Read the actual parent of the contributor's patch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: KoNit-K/hermes-agent
          ref: 3b044261b6afe97277d48e7e75c65ce34e76e8a2
          path: parent
          persist-credentials: false
          lfs: false
          submodules: false
      - name: Read the contributor's exact proposed code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: KoNit-K/hermes-agent
          ref: 59048b3a0335216b7983072bb1d006a179ca57ae
          path: candidate
          persist-credentials: false
          lfs: false
          submodules: false
      - name: Prepare isolated test dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/review-venv"
          "$RUNNER_TEMP/review-venv/bin/python" -m pip install --disable-pip-version-check pytest==8.4.2 python-dotenv==1.2.2 pyyaml==6.0.3 rich==14.3.3 openai==2.24.0 requests==2.33.0 tenacity==9.1.4
      - name: Preserve actual passing and failing assertions
        run: |
          "$RUNNER_TEMP/review-venv/bin/python" contribution/contributions/hermes-replay-upstream-review/verify.py --base parent --head candidate --out "$RUNNER_TEMP/replay-upstream-evidence"
      - name: Retain assessment reports, not private inputs or databases
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hermes-replay-upstream-review
          path: |
            ${{ runner.temp }}/replay-upstream-evidence/*.json
            ${{ runner.temp }}/replay-upstream-evidence/*.jsonl
            ${{ runner.temp }}/replay-upstream-evidence/*.xml
            ${{ runner.temp }}/replay-upstream-evidence/*.txt
          if-no-files-found: warn
          retention-days: 14
