name: Check approval trace utility
on:
  pull_request:
    paths:
      - 'tools/approval-trace-check/**'
      - '.github/workflows/approval-trace-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Read exact pre-correction source for the comparison
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: YS-OH-CORE/second-paddle-notes
          ref: c5c4dca611790dbd445ba1c5b19c699fb5fa672d
          path: previous-source
          persist-credentials: false
      - name: Check sources and execute synthetic regressions
        shell: bash
        run: |
          set -euo pipefail
          cd tools/approval-trace-check
          python3 build.py --check
          node --test test.cjs test-unique-json.cjs | tee "$RUNNER_TEMP/approval-trace-tests.tap"
          node compare-unique-json.cjs ../../previous-source/tools/approval-trace-check/audit.js | tee "$RUNNER_TEMP/duplicate-member-comparison.json"
      - name: Preserve observed test output and exact standalone file
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: approval-trace-check
          path: |
            ${{ runner.temp }}/approval-trace-tests.tap
            ${{ runner.temp }}/duplicate-member-comparison.json
            tools/approval-trace-check/index.html
          if-no-files-found: warn
          retention-days: 14
