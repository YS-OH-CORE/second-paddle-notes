name: Existing binding contribution - tested port
'on':
  push:
    branches: [ops/hermes-binding-current-main-20260919]
    paths: [port-check.request.json, .github/workflows/binding-port-check.yml]
permissions: {}
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Install the pinned resolver in this disposable runner
        run: python -m pip install --disable-pip-version-check --no-cache-dir uv==0.12.13
      - name: Fetch exact verifier and tests
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          for file in prepare_port.py prepare_port_v2.py execute_port_check.py execute_port_check_v2.py test_model_binding_reasoning_port.py; do
            curl --fail --location --max-time 30 "https://raw.githubusercontent.com/YS-OH-CORE/second-paddle-notes/${SOURCE_SHA}/${file}" -o "$file"
          done
          echo 'e15c66e47cb914af07163b3d600d01fb1a1b80127ba644552f98728a02677a5f  prepare_port.py' | sha256sum --check
          echo 'fb846ec816f4ce294b6bc4247801cda7c4178bdb5d7a3a309aca9c04cdda5c81  prepare_port_v2.py' | sha256sum --check
          echo '07512fd7be0ff612df675bcc1f1bdcce279ed423930d8ee6e59dde765994188b  execute_port_check.py' | sha256sum --check
          echo 'd21625cc0ac58bd4a9f7e4b213bd64b02ff2793f1d78d7169088f285988a2c84  execute_port_check_v2.py' | sha256sum --check
          echo '1c4ce8b20ed25fae4ebbcd7f8f02d534acf477ae84b4321352483d06be54c7c7  test_model_binding_reasoning_port.py' | sha256sum --check
          python -B -u execute_port_check_v2.py
      - name: Preserve the public candidate patch in the log without artifact storage
        if: always()
        run: |
          python -B - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, json
          for name in ['current-main-port.patch', 'MANIFEST.json', 'UPSTREAM_LICENSE']:
              path=Path('generated')/name
              if path.is_file():
                  data=path.read_bytes()
                  print('PUBLIC_PORT_FILE '+json.dumps({'name':name,'sha256':hashlib.sha256(data).hexdigest(),'bytes':len(data),'encoding':'gzip+base64','content':base64.b64encode(gzip.compress(data,mtime=0)).decode()}))
          PY
