name: Run one separate CPU model on correction development inputs
'on':
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'contributions/correction-model-smoke/run.py'
      - 'contributions/correction-model-smoke/inputs.compact.json'
      - '.github/workflows/correction-model-smoke.yml'
permissions:
  contents: read
jobs:
  development-inference:
    if: github.repository == 'YS-OH-CORE/second-paddle-notes' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'zero/correction-model-smoke-20260914'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Submit only fixed synthetic prompts to fresh local model processes
        shell: bash
        run: |
          set -euo pipefail
          timeout 780s python -B -S contributions/correction-model-smoke/run.py --out "$RUNNER_TEMP/correction-results" --work "$RUNNER_TEMP/correction-runtime" 2>&1 | tee "$RUNNER_TEMP/correction-run.log"
      - name: Retain synthetic outputs and logs, never model weights or runtime
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: correction-model-smoke
          path: |
            ${{ runner.temp }}/correction-results/*.json
            ${{ runner.temp }}/correction-results/*.jsonl
            ${{ runner.temp }}/correction-results/*.log
            ${{ runner.temp }}/correction-run.log
          if-no-files-found: error
          retention-days: 1
