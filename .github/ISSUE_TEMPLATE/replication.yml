name: Replication report
description: Submit a complete rerun of a named note or executable artifact.
title: "[Replication] "
body:
  - type: markdown
    attributes:
      value: |
        The repository currently has zero independently submitted or verified external replications. A report changes that record only after its evidence is publicly inspectable and reviewed. Read the [replication guide](https://github.com/YS-OH-CORE/second-paddle-notes/blob/main/REPLICATION.md) before submitting.

  - type: dropdown
    id: independence
    attributes:
      label: Independence level
      description: Choose the closest description and explain assistance below.
      options:
        - Independent
        - Partially independent
        - Author-assisted
    validations:
      required: true

  - type: input
    id: target
    attributes:
      label: Evaluated artifact
      description: Give the note or experiment path and exact repository commit SHA or release tag.
      placeholder: "experiments/rule-use-eval at commit <40-character SHA>"
    validations:
      required: true

  - type: input
    id: cases_scorer
    attributes:
      label: Case-set and scorer versions
      placeholder: "cases hash/version; scorer path and hash/version"
    validations:
      required: true

  - type: textarea
    id: model
    attributes:
      label: Model and access path
      description: Include provider, exact model or endpoint identifier, dated version if exposed, API/app/host, and relevant response metadata. Do not guess a hidden version.
    validations:
      required: true

  - type: input
    id: run_date
    attributes:
      label: Run date and time zone
      placeholder: "2026-08-25, 14:30-16:10 KST (UTC+09:00)"
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Execution environment
      description: Report runner role, OS/runtime, dependency versions, adapter, hardware when relevant, and the exact run and scoring commands.
    validations:
      required: true

  - type: textarea
    id: prompts
    attributes:
      label: Complete prompts and tools
      description: Paste public-safe system, developer, user, and tool prompts, or link stable files and give hashes. List available tools and response format.
    validations:
      required: true

  - type: textarea
    id: settings
    attributes:
      label: Inference and execution settings
      description: Include temperature, top_p, token limits, reasoning setting if exposed, timeout, retries, concurrency, ordering/randomization, and stopping rule. Write "not exposed" where applicable.
    validations:
      required: true

  - type: textarea
    id: seeds
    attributes:
      label: Seeds and determinism
      description: Give every run seed and determinism guarantee, or state that no controllable or guaranteed seed was available.
    validations:
      required: true

  - type: textarea
    id: runs
    attributes:
      label: Planned and completed runs
      description: Give planned and completed counts, failed runs, refusals, errors, timeouts, and whether any stopping decision changed after results were visible.
    validations:
      required: true

  - type: textarea
    id: raw_outputs
    attributes:
      label: Raw outputs and manifest
      description: Link or attach unedited outputs for every run plus a checksum manifest. Include failures. Describe any redaction without rewriting evaluated content.
      placeholder: "Stable public URL; SHA-256 manifest; redaction map if any"
    validations:
      required: true

  - type: textarea
    id: exclusions
    attributes:
      label: Exclusions and manual judgments
      description: List each exclusion or judgment, its preregistered rule and reason, who decided, and whether the decision preceded inspection. Write "None" if none.
    validations:
      required: true

  - type: textarea
    id: results
    attributes:
      label: Results and uncertainty
      description: Report the preregistered primary metric, denominator, uncertainty, repeated-run variation, and exploratory results separately. A selected success is not a replicated result.
    validations:
      required: true

  - type: textarea
    id: assistance
    attributes:
      label: Assistance and conflicts
      description: Describe any author/maintainer help, affiliation, financial interest, competing work, or write "None known."
    validations:
      required: true

  - type: checkboxes
    id: safeguards
    attributes:
      label: Evidence and public-submission safeguards
      options:
        - label: I included all planned runs, including failures and exclusions, rather than selecting only favorable outputs.
          required: true
        - label: I removed credentials, private data, non-public session content, and identifying information about third parties.
          required: true
        - label: I created the submitted material or have the right to share it; restricted third-party content is linked rather than copied.
          required: true
        - label: I understand this report is not independently verified until a public maintainer review records that status.
          required: true
        - label: I will not describe deterministic fixture output as language-model performance.
          required: true
